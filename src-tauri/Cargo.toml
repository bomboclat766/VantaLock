[package]
name = "vantalock_core"
version = "1.1.49"
edition = "2021"

[dependencies]
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rand = "0.8"
bip39 = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3.8"
